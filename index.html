<!-- ═══════════════════════════════════════════ -->
<!-- FILE: index.html                            -->
<!-- PURPOSE: Home/landing page — displays hero  -->
<!--   banner, popular tags, trending videos,    -->
<!--   new releases, and browse-by-tag grid.     -->
<!-- ═══════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEAD                               -->
<!-- ═══════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Blocking inline script: Sets data-theme before paint to prevent FOUC -->
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and play high-quality video content across tech, music, gaming, and lifestyle on Antigravity Play.">

  <title>Browse Videos - Antigravity Play</title>

  <!-- OpenSearch link: enables browser search engine integration -->
  <link rel="search" type="application/opensearchdescription+xml" title="Antigravity Play" href="./opensearch.xml">
  <!-- RSS alternate link: for feed readers -->
  <link rel="alternate" type="application/rss+xml" title="Antigravity Play RSS Feed" href="./rss-feed.html">

  <!-- main.css: Global design system & base styles -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- home.css: Home page-specific styles (hero, rows, scroll containers, tag grid) -->
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: TOAST NOTIFICATION CONTAINER       -->
<!-- ═══════════════════════════════════════════ -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: CONFIRMATION MODAL                 -->
<!-- ═══════════════════════════════════════════ -->
<div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Confirm Action</h3>
      <button class="modal-close" aria-label="Close dialog">&times;</button>
    </div>
    <div class="modal-body">
      Are you sure you want to proceed?
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
      <button class="btn btn-primary confirm-modal-btn">Confirm</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEADER / NAVBAR                    -->
<!-- ═══════════════════════════════════════════ -->
<header id="navbar-container" class="navbar-wrapper"></header>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: MAIN CONTENT                       -->
<!-- ═══════════════════════════════════════════ -->
<main class="container min-h-80vh">

  <!-- Hero Banner: featured video area populated by home.js -->
  <section id="hero-section" aria-label="Featured Video"></section>

  <!-- Popular Tags Row: pill-style tag buttons -->
  <section class="row-section" aria-labelledby="tags-heading">
    <h2 id="tags-heading" class="row-title row-title-mb">Popular Tags</h2>
    <div id="popular-tags-container" class="tags-pill-row">
      <!-- Tag pills injected via home.js -->
    </div>
  </section>

  <!-- Trending Row: horizontally scrollable video cards sorted by views -->
  <section class="row-section" aria-labelledby="trending-heading">
    <div class="row-header">
      <h2 id="trending-heading" class="row-title">Trending Now</h2>
      <a href="./search.html" class="row-link">See All</a>
    </div>
    <div class="scroll-container-wrapper">
      <div id="trending-container" class="scroll-container">
        <!-- Video cards injected via home.js -->
      </div>
    </div>
  </section>

  <!-- New Releases Row: horizontally scrollable video cards sorted by date -->
  <section class="row-section" aria-labelledby="new-heading">
    <div class="row-header">
      <h2 id="new-heading" class="row-title">New Releases</h2>
      <a href="./search.html" class="row-link">See All</a>
    </div>
    <div class="scroll-container-wrapper">
      <div id="new-releases-container" class="scroll-container">
        <!-- Video cards injected via home.js -->
      </div>
    </div>
  </section>

  <!-- Browse by Tag Section: grid of tag category cards -->
  <section class="row-section" aria-labelledby="browse-tag-heading" style="margin-bottom: var(--space-5xl);">
    <div class="row-header">
      <h2 id="browse-tag-heading" class="row-title">Browse by Tag</h2>
    </div>
    <div id="browse-tag-grid" class="browse-tag-grid">
      <!-- Tag cards injected via home.js -->
    </div>
  </section>

</main>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: FOOTER                             -->
<!-- ═══════════════════════════════════════════ -->
<footer id="footer-container"></footer>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: SCRIPTS                            -->
<!-- ═══════════════════════════════════════════ -->
<script src="./js/mockData.js"></script>
<script src="./js/main.js"></script>
<script src="./js/components.js"></script>
<script src="./js/animations.js"></script>
<!-- home.js: Home page initialization — populates hero, tags, trending,
     new releases, and browse-by-tag sections from mock data -->
<script src="./js/home.js"></script>
</body>
</html>
