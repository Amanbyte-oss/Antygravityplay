<!-- FILE: skeleton-loader.html                 -->
<!-- PURPOSE: Loading placeholder mimicking a   -->
<!--   video card — thumbnail skeleton plus     -->
<!--   three text line skeletons.               -->
<!-- ═══════════════════════════════════════════ -->

<!-- ─── Skeleton card — shown while data loads ────────────── -->
<div class="video-card">
  <!-- Thumbnail placeholder (16:9 ratio) -->
  <div class="thumbnail-container skeleton" style="aspect-ratio: 16/9; margin-bottom: var(--space-md);"></div>
  <!-- Title and metadata line placeholders -->
  <div style="display:flex; flex-direction:column; gap: var(--space-sm);">
    <div class="skeleton" style="height: 16px; width: 85%;"></div>
    <div class="skeleton" style="height: 12px; width: 60%;"></div>
    <div class="skeleton" style="height: 10px; width: 40%; margin-top: 4px;"></div>
  </div>
</div>
