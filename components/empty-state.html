<!-- ═══════════════════════════════════════════ -->
<!-- FILE: empty-state.html                     -->
<!-- PURPOSE: Empty state display — minus-icon, -->
<!--   "No items found" heading, and a hint to  -->
<!--   adjust filters — shown when data is      -->
<!--   absent.                                  -->
<!-- ═══════════════════════════════════════════ -->

<!-- ─── Empty state container ────────────────────────────── -->
<div class="empty-state-container" style="text-align: center; padding: var(--space-4xl) var(--space-xl); border: 1px dashed var(--border); border-radius: var(--radius-lg); background-color: var(--bg-secondary);">
  <!-- Empty / minus icon -->
  <svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5" viewBox="0 0 24 24" style="margin: 0 auto var(--space-md) auto; display:block;">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="8" y1="12" x2="16" y2="12"></line>
  </svg>
  <!-- Empty state heading -->
  <h3 style="font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-xs);">No items found</h3>
  <!-- Guidance text for the user -->
  <p style="font-size: var(--text-sm); color: var(--text-muted);">Try adjusting your query parameters or filters.</p>
</div>
