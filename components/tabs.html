<!-- ═══════════════════════════════════════════ -->
<!-- FILE: tabs.html                            -->
<!-- PURPOSE: Tab navigation component with     -->
<!--   three tab buttons and matching content   -->
<!--   panels. Controlled via data-tabs JS.     -->
<!-- ═══════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: TABS CONTAINER                    -->
<!-- ═══════════════════════════════════════════ -->
<div class="tabs-container" data-tabs>

  <!-- ─── Tab Navigation ────────────────────────── -->
  <div class="tabs-nav" role="tablist">
    <!-- First tab (active by default) -->
    <button class="tabs-tab active" role="tab" aria-selected="true" data-tab="tab1" id="tab-tab1">
      Tab 1
    </button>
    <!-- Second tab -->
    <button class="tabs-tab" role="tab" aria-selected="false" data-tab="tab2" id="tab-tab2">
      Tab 2
    </button>
    <!-- Third tab -->
    <button class="tabs-tab" role="tab" aria-selected="false" data-tab="tab3" id="tab-tab3">
      Tab 3
    </button>
  </div>

  <!-- ─── Tab Content Panels ─────────────────────── -->
  <div class="tabs-panels">
    <!-- Panel for Tab 1 -->
    <div class="tabs-panel active" role="tabpanel" id="panel-tab1" aria-labelledby="tab-tab1">
      Panel 1 content
    </div>
    <!-- Panel for Tab 2 -->
    <div class="tabs-panel" role="tabpanel" id="panel-tab2" aria-labelledby="tab-tab2">
      Panel 2 content
    </div>
    <!-- Panel for Tab 3 -->
    <div class="tabs-panel" role="tabpanel" id="panel-tab3" aria-labelledby="tab-tab3">
      Panel 3 content
    </div>
  </div>
</div>
