<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Watch high-quality streaming videos, view descriptions, and explore related suggestions on Antigravity Play.">
  <title>Watch Video - Antigravity Play</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/watch.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Reusable Confirmation Modal Container -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Navbar injected here -->
  <header id="navbar-container" class="navbar-wrapper"></header>

  <main class="container">
    <div style="margin-bottom: var(--space-lg);">
      <a href="#" onclick="history.back(); return false;" style="display:inline-flex; align-items:center; gap:4px; font-size:var(--text-xs); color:var(--text-muted);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back
      </a>
    </div>
    <div class="watch-grid">
      
      <!-- Left Column: Video Player & Details -->
      <section aria-label="Video Player Area">
        <div class="player-container" id="player-container">
          <div id="player-embed-placeholder" style="display:none; width:100%; height:100%;"></div>
          <video id="main-video-player" controls preload="metadata" crossorigin="anonymous" style="display:none;">
            Your browser does not support HTML5 video streaming.
          </video>
          <div id="player-loading" class="player-loading" style="display:none;">
            <div class="loader-spinner"></div>
            <span>Loading video...</span>
          </div>
        </div>

        <div class="video-watch-details">
          <h1 id="watch-title" class="watch-title">Video Title Loading...</h1>
          
          <div class="watch-actions-row">
            <div class="watch-meta-text">
              <span id="watch-views-count">0</span> views &bull; 
              Uploaded on <span id="watch-publish-date">YYYY-MM-DD</span>
            </div>
            
            <div class="watch-actions">
              <button class="like-btn" id="watch-like-btn" aria-label="Like this video">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                </svg>
                <span id="watch-like-count">0</span>
              </button>
            </div>
          </div>
        </div>

        <div class="video-description-box">
          <div class="creator-profile">
            <div class="creator-avatar" id="creator-avatar-letter">A</div>
            <div class="creator-info">
              <h3 id="creator-name">Creator Studio</h3>
              <p>Verified Creator</p>
            </div>
          </div>
          <p id="watch-description" class="description-text">Description Loading...</p>
          <div id="watch-tags-row" class="tags-row"></div>
        </div>
      </section>

      <!-- Right Column: Related Videos -->
      <aside class="watch-sidebar" aria-labelledby="sidebar-heading">
        <h2 id="sidebar-heading" class="sidebar-title">Up Next</h2>
        <div id="related-videos-container" style="display:flex; flex-direction:column; gap: var(--space-lg);">
          <!-- Related video items injected here -->
        </div>
      </aside>

    </div>
  </main>

  <!-- Sticky Bottom Now Playing Drawer (Spotify style) -->
  <section class="now-playing-bar-wrapper" id="now-playing-bar" aria-label="Now Playing Mini Controller">
    
    <!-- Mini Player details -->
    <div class="now-playing-left">
      <div class="now-playing-thumb">
        <img id="np-thumb" src="" alt="Thumbnail">
      </div>
      <div class="now-playing-info">
        <span class="now-playing-title" id="np-title">Title</span>
        <span class="now-playing-creator" id="np-creator">Creator</span>
      </div>
      <button class="like-btn" id="np-heart" aria-label="Like video" style="background:none; border:none; padding:4px;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
        </svg>
      </button>
    </div>

    <!-- Mini Player controls -->
    <div class="now-playing-center">
      <div class="player-controls" id="np-player-controls">
        <button class="control-btn" id="np-prev-btn" aria-label="Previous (Not implemented)" style="opacity: 0.5;">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <polygon points="19,20 9,12 19,4"></polygon><line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>
        <button class="control-btn control-btn-play" id="np-play-btn" aria-label="Toggle Play/Pause">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <polygon points="8,5 19,12 8,19"></polygon>
          </svg>
        </button>
        <button class="control-btn" id="np-next-btn" aria-label="Next (Not implemented)" style="opacity: 0.5;">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <polygon points="5,4 15,12 5,20"></polygon><line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>
      </div>
      <div class="progress-bar-container" id="np-progress-container">
        <span class="progress-time" id="np-time-current">0:00</span>
        <div class="progress-slider-bg" id="np-progress-track">
          <div class="progress-slider-fill" id="np-progress-fill"></div>
        </div>
        <span class="progress-time" id="np-time-total">0:00</span>
      </div>
    </div>

    <!-- Mini Player volume -->
    <div class="now-playing-right" id="np-volume-container">
      <button class="control-btn" id="np-mute-btn" aria-label="Mute volume">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <div class="volume-bar-container">
        <div class="volume-slider-bg" id="np-volume-track">
          <div class="volume-slider-fill" id="np-volume-fill"></div>
        </div>
      </div>
    </div>

  </section>

  <!-- Footer injected here -->
  <footer id="footer-container" style="margin-top: 100px;"></footer>

  <!-- Scripts -->
  <script src="./js/mockData.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/watch.js"></script>
</body>
</html>
