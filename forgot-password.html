<!-- ═══════════════════════════════════════════ -->
<!-- FILE: forgot-password.html                  -->
<!-- PURPOSE: Multi-step password reset flow:    -->
<!--   Step 1 = identity verification via        -->
<!--   security questions; Step 2 = new password. -->
<!-- ═══════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEAD                               -->
<!-- ═══════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your admin password by verifying your identity.">

  <title>Forgot Password - Antigravity Play</title>

  <!-- main.css: Global design system & base styles -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- login.css: Shared styles for auth pages (login card, form inputs, buttons) -->
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: TOAST NOTIFICATION CONTAINER       -->
<!-- ═══════════════════════════════════════════ -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: CONFIRMATION MODAL                 -->
<!-- ═══════════════════════════════════════════ -->
<div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Confirm</h3><button class="modal-close">&times;</button></div>
    <div class="modal-body">Are you sure?</div>
    <div class="modal-footer"><button class="btn btn-secondary cancel-modal-btn">Cancel</button><button class="btn btn-primary confirm-modal-btn">Confirm</button></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEADER / NAVBAR                    -->
<!-- ═══════════════════════════════════════════ -->
<header id="navbar-container" class="navbar-wrapper"></header>

<main class="container login-layout">

  <article class="login-card" id="fp-card">
    <div class="login-logo">
      <svg class="logo-icon" width="40" height="40" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="var(--accent)"></circle>
        <polygon points="10,8 16,12 10,16" fill="#000"></polygon>
      </svg>
      <h2>Reset Password</h2>
      <p id="fp-subtitle">Verify your identity to reset the admin password.</p>
    </div>

    <!-- Step 1: Security Questions Form -->
    <form id="fp-verify-form" class="login-form">
      <div class="form-group">
        <label class="form-label" for="fp-fullname">Your Full Name</label>
        <input type="text" id="fp-fullname" class="form-input-field" placeholder="Enter your full name" required autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="fp-mothername">Mother's Full Name</label>
        <input type="text" id="fp-mothername" class="form-input-field" placeholder="Enter mother's full name" required autocomplete="off">
        <div id="fp-error-msg" class="login-error-msg" role="alert"></div>
      </div>
      <button type="submit" class="login-btn" id="fp-verify-btn">Verify Identity</button>
      <div class="forgot-link-wrap">
        <a href="./login.html" class="forgot-link">&larr; Back to Login</a>
      </div>
    </form>

    <!-- Step 2: Reset Password Form (hidden initially, shown after verification) -->
    <form id="fp-reset-form" class="login-form" style="display:none;">
      <div class="form-group">
        <label class="form-label" for="fp-new-password">New Password</label>
        <input type="password" id="fp-new-password" class="form-input-field" placeholder="Enter new password (min 6 chars)" required minlength="6" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="fp-confirm-password">Confirm New Password</label>
        <input type="password" id="fp-confirm-password" class="form-input-field" placeholder="Confirm new password" required autocomplete="off">
      </div>
      <button type="submit" class="login-btn" id="fp-reset-btn">Update Password</button>
      <div class="forgot-link-wrap">
        <a href="./login.html" class="forgot-link">&larr; Back to Login</a>
      </div>
    </form>
  </article>

</main>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: FOOTER                             -->
<!-- ═══════════════════════════════════════════ -->
<footer id="footer-container"></footer>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: SCRIPTS                            -->
<!-- ═══════════════════════════════════════════ -->
<script src="./js/mockData.js"></script>
<script src="./js/main.js"></script>
<script src="./js/components.js"></script>
<script src="./js/animations.js"></script>
<!-- forgot-password.js: Identity verification and password reset logic -->
<script src="./js/forgot-password.js"></script>
</body>
</html>
