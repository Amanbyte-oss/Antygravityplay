<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Embed</title>
  <link rel="stylesheet" href="./css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #embed-player-wrap { width: 100%; height: 100%; position: relative; }
    #embed-player-wrap iframe { width: 100%; height: 100%; border: 0; }
    #embed-player-wrap video { width: 100%; height: 100%; display: block; }
    #embed-error { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-family: system-ui, sans-serif; font-size: 14px; text-align: center; padding: 20px; }
    #embed-loading { display: flex; align-items: center; justify-content: center; height: 100%; }
    .spinner { width: 36px; height: 36px; border: 3px solid #2e2e2e; border-top-color: #1ed760; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="embed-player-wrap">
    <div id="embed-loading"><div class="spinner"></div></div>
    <div id="embed-error" style="display:none;">This video is unavailable.</div>
  </div>

  <script src="./js/mockData.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/supabase-api.js"></script>
  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get('id');
    if (!videoId) { showError(); return; }

    function showError() {
      var err = document.getElementById('embed-error');
      var load = document.getElementById('embed-loading');
      if (err) err.style.display = 'flex';
      if (load) load.style.display = 'none';
    }

    function renderPlayer(video) {
      var wrap = document.getElementById('embed-player-wrap');
      var load = document.getElementById('embed-loading');
      var err = document.getElementById('embed-error');
      if (!wrap) return;
      if (load) load.style.display = 'none';

      var vs = video.video_source || '';
      var ec = video.embed_code || '';
      var eu = video.external_url || '';
      var videoUrl = eu || video.videoUrl || '';

      if (ec && (['youtube','vimeo','dailymotion','streamable','cloudflare','peertube','wistia','abyss','pornhub','googledrive','screenpal','dropbox','onedrive'].indexOf(vs) !== -1 || vs === 'embed')) {
        var iframe = document.createElement('iframe');
        iframe.src = ec;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        wrap.insertBefore(iframe, err || null);
      } else if (videoUrl) {
        var videoEl = document.createElement('video');
        videoEl.src = videoUrl;
        videoEl.controls = true;
        videoEl.autoplay = true;
        videoEl.style.width = '100%';
        videoEl.style.height = '100%';
        wrap.insertBefore(videoEl, err || null);
      } else {
        showError();
      }
    }

    function loadAndRender(id) {
      (async function() {
        if (window.__supabase && window.SupabaseVideos) {
          try {
            var sb = await window.SupabaseVideos.fetchById(id);
            if (sb) { renderPlayer(sb); return; }
          } catch(e) {}
        }
        var vids = window.App.getVideos();
        var v = vids.find(function(x) { return x.id === id; });
        if (v) { renderPlayer(v); return; }
        if (window.__supabase && window.SupabaseVideos) { showError(); return; }
        document.addEventListener('supabase-ready', function retry() {
          document.removeEventListener('supabase-ready', retry);
          loadAndRender(id);
        });
      })();
    }

    loadAndRender(videoId);
  })();
  </script>
</body>
</html>
