<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore published videos categorized under specific topics on Antigravity Play.">
  <title>Category Videos - Antigravity Play</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/category.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Reusable Confirmation Modal Container -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Navbar injected here -->
  <header id="navbar-container" class="navbar-wrapper"></header>

  <main class="container" id="category-page-container" style="min-height: 80vh;">
    
    <!-- Category Hero Header (populates via category.js) -->
    <section id="category-hero-section" aria-label="Category Overview"></section>

    <!-- Category Video list grid -->
    <section aria-labelledby="grid-heading">
      <div class="category-grid-title">
        <h2 id="grid-heading">Collection Catalog</h2>
        <a href="./index.html" style="font-size: var(--text-sm); font-weight:600; color: var(--text-secondary);">&larr; Back to Browse</a>
      </div>
      <div id="category-video-grid" class="category-video-grid">
        <!-- Videos injected here -->
      </div>
    </section>

  </main>

  <!-- Footer injected here -->
  <footer id="footer-container"></footer>

  <!-- Scripts -->
  <script src="./js/mockData.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/category.js"></script>
</body>
</html>
