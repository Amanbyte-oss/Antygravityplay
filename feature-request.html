<!-- ═══════════════════════════════════════════ -->
<!-- FILE: feature-request.html                  -->
<!-- PURPOSE: Feature request form page where    -->
<!--   users can submit suggestions for new      -->
<!--   platform features.                        -->
<!-- ═══════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEAD                               -->
<!-- ═══════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a feature for Antigravity Play - suggest new ideas and improvements">

  <title>Feature Request - Antigravity Play</title>

  <!-- main.css: Global design system & base styles -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- legal.css: Legal/info page-specific styles (headers, sections, date) -->
  <link rel="stylesheet" href="./css/legal.css">
  <!-- forms.css: Form-specific styles for inputs, textareas, selects, and buttons -->
  <link rel="stylesheet" href="./css/forms.css">
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: TOAST NOTIFICATION CONTAINER       -->
<!-- ═══════════════════════════════════════════ -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: CONFIRMATION MODAL                 -->
<!-- ═══════════════════════════════════════════ -->
<div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Confirm</h3><button class="modal-close">&times;</button></div>
    <div class="modal-body">Are you sure?</div>
    <div class="modal-footer"><button class="btn btn-secondary cancel-modal-btn">Cancel</button><button class="btn btn-primary confirm-modal-btn">Confirm</button></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEADER / NAVBAR                    -->
<!-- ═══════════════════════════════════════════ -->
<header id="navbar-container" class="navbar-wrapper"></header>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: MAIN CONTENT (form-page)           -->
<!-- ═══════════════════════════════════════════ -->
<!-- form-page: standard layout for form pages with a form card,
     success message, and client-side submission handling -->
<main class="container form-page">
  <div class="form-header">
    <h1>Feature Request</h1>
    <p>Have an idea? Tell us what you'd like to see on Antigravity Play.</p>
  </div>
  <div class="form-card">
    <!-- Hidden success state shown after form submission -->
    <div class="form-success" id="form-success">
      <svg class="form-success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <h2>Thank You!</h2>
      <p>We review every feature request and will consider it for a future update.</p>
    </div>
    <form id="main-form">
      <div class="form-group">
        <label class="form-label" for="feature-title">Feature Title <span class="required">*</span></label>
        <input class="form-input" id="feature-title" type="text" placeholder="What would you like to see?" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="feature-category">Category <span class="required">*</span></label>
        <select class="form-select" id="feature-category" required>
          <option value="">Select a category...</option>
          <option value="player">Video Player</option>
          <option value="ui">User Interface</option>
          <option value="admin">Admin Features</option>
          <option value="search">Search & Discovery</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="feature-description">Description <span class="required">*</span></label>
        <textarea class="form-textarea" id="feature-description" placeholder="Describe the feature in detail. How would it work?" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="feature-why">Why is this important?</label>
        <textarea class="form-textarea" id="feature-why" placeholder="How would this feature benefit you or others?" style="min-height:100px;"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit Request</button>
      </div>
    </form>
  </div>
</main>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: FOOTER                             -->
<!-- ═══════════════════════════════════════════ -->
<footer id="footer-container" style="margin-top: 100px;"></footer>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: SCRIPTS                            -->
<!-- ═══════════════════════════════════════════ -->
<script src="./js/mockData.js"></script>
<script src="./js/main.js"></script>
<script src="./js/components.js"></script>
<script src="./js/animations.js"></script>

  <!-- Init: inject navbar, footer, animations; attach form submission handler -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.Components.injectNavbar();
    window.Components.injectFooter();
    window.Animations.initScrollReveal();
    // Inline form handler: hides form on submit and shows success message
    const form = document.getElementById('main-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        form.style.display = 'none';
        document.getElementById('form-success').classList.add('show');
      });
    }
  });
</script>
</body>
</html>
