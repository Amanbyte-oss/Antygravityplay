<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Internal server error - something went wrong">
  <title>500 Server Error - Antigravity Play</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/system.css">
</head>
<body>
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header"><h3 class="modal-title">Confirm</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer"><button class="btn btn-secondary cancel-modal-btn">Cancel</button><button class="btn btn-primary confirm-modal-btn">Confirm</button></div>
    </div>
  </div>
  <header id="navbar-container" class="navbar-wrapper"></header>
  <main class="container system-page">
    <svg class="system-icon error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div class="system-code">500</div>
    <h1 class="system-title">Server Error</h1>
    <p class="system-desc">Something went wrong on our end. Our team has been notified and we are working to fix the issue. Please try again shortly.</p>
    <div class="system-actions">
      <button class="btn btn-primary" onclick="location.reload()">Try Again</button>
      <a href="./index.html" class="btn btn-secondary">Go Home</a>
    </div>
  </main>
  <footer id="footer-container" style="margin-top: 100px;"></footer>
  <script src="./js/mockData.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.Components.injectNavbar();
      window.Components.injectFooter();
      window.Animations.initScrollReveal();
    });
  </script>
</body>
</html>
