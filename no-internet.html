<!-- ═══════════════════════════════════════════ -->
<!-- FILE: no-internet.html                      -->
<!-- PURPOSE: Shown when the user has no network -->
<!--   connectivity (detected by browser).       -->
<!-- ═══════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEAD                               -->
<!-- ═══════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">

<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="No internet connection detected">

  <title>No Internet - Antigravity Play</title>

  <!-- main.css: Global design system & base styles -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- system.css: System/status page styles (centered content, error icons) -->
  <link rel="stylesheet" href="./css/system.css">
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: TOAST NOTIFICATION CONTAINER       -->
<!-- ═══════════════════════════════════════════ -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: CONFIRMATION MODAL                 -->
<!-- ═══════════════════════════════════════════ -->
<div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Confirm</h3><button class="modal-close">&times;</button></div>
    <div class="modal-body">Are you sure?</div>
    <div class="modal-footer"><button class="btn btn-secondary cancel-modal-btn">Cancel</button><button class="btn btn-primary confirm-modal-btn">Confirm</button></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: HEADER / NAVBAR                    -->
<!-- ═══════════════════════════════════════════ -->
<header id="navbar-container" class="navbar-wrapper"></header>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: MAIN CONTENT (system-page)         -->
<!-- ═══════════════════════════════════════════ -->
<main class="container system-page">
  <!-- No-internet icon: WiFi signal with X across it -->
  <svg class="system-icon error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.82a9 9 0 0 1 14 0"/><path d="M8.5 16.82a4.5 4.5 0 0 1 7 0"/></svg>
  <h1 class="system-title">No Internet Connection</h1>
  <p class="system-desc">Please check your internet connection and try again. The platform requires a stable internet connection to function.</p>
  <div class="system-actions">
    <button class="btn btn-primary" onclick="location.reload()">Retry</button>
  </div>
</main>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: FOOTER                             -->
<!-- ═══════════════════════════════════════════ -->
<footer id="footer-container" style="margin-top: 100px;"></footer>

<!-- ═══════════════════════════════════════════ -->
<!-- SECTION: SCRIPTS                            -->
<!-- ═══════════════════════════════════════════ -->
<script src="./js/mockData.js"></script>
<script src="./js/main.js"></script>
<script src="./js/components.js"></script>
<script src="./js/animations.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.Components.injectNavbar();
    window.Components.injectFooter();
    window.Animations.initScrollReveal();
  });
</script>
</body>
</html>
