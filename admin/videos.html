<!DOCTYPE html>
<html lang="en">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View, search, filter, inline edit, and bulk delete video database assets.">
  <title>Manage Videos - Admin Console</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin/dashboard.css">
  <link rel="stylesheet" href="../css/admin/videos.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Reusable Confirmation Modal -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="admin-layout">
    
    <!-- Sidebar Overlay for mobile menu -->
    <div class="sidebar-overlay"></div>

    <!-- Admin Sidebar injected here -->
    <aside id="sidebar-container"></aside>

    <!-- Main Content Area -->
    <div class="admin-main">
      
      <!-- Top Mobile Header bar -->
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn" aria-label="Open sidebar menu" style="display:none; border:none; background:none; cursor:pointer;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span style="font-weight: 600; font-size: var(--text-sm);">Console</span>
        </div>
        <div class="admin-header-right">
          <a href="../index.html" class="btn btn-secondary">
            View Live Site
          </a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
              <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            </svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="admin-body">
        
        <!-- Welcome Title row -->
        <div class="admin-title-row">
          <div class="admin-title-group">
            <h1>Video Repository</h1>
            <p>Manage, paginate, search, and inline-edit your published clips and drafts.</p>
          </div>
          <div>
            <a href="./upload.html" class="btn btn-primary">
              Upload Video
            </a>
          </div>
        </div>

        <!-- Management controls -->
        <div class="management-bar">
          
          <div class="management-left">
            <div class="table-search-container">
              <span class="table-search-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input type="text" id="table-search-input" placeholder="Search by title or creator..." aria-label="Search items">
            </div>
          </div>

          <!-- Bulk actions toolbar (hidden by default) -->
          <div class="management-right" id="bulk-actions-bar" style="display:none;">
            <span id="bulk-selected-count">0 selected</span>
            <button id="delete-selected-btn" class="btn btn-secondary delete-btn-sm">
              Delete Selected
            </button>
          </div>

        </div>

        <!-- Data Table Container -->
        <section class="table-card" aria-label="Videos catalog listing">
          <div class="table-header">
            <h2 class="table-title">Catalog Inventory</h2>
            <span style="font-size: var(--text-xs); color: var(--text-muted);" id="table-count-span">0 total videos</span>
          </div>
          
          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th class="checkbox-cell">
                    <input type="checkbox" id="header-checkbox" class="admin-checkbox" aria-label="Select all visible videos">
                  </th>
                  <th>Thumbnail</th>
                  <th class="sortable-header" data-sort="title">Title</th>
                  <th>Tags</th>
                  <th class="sortable-header" data-sort="views">Views</th>
                  <th class="sortable-header" data-sort="likes">Likes</th>
                  <th class="sortable-header" data-sort="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="videos-tbody">
                <!-- Dynamically populated via JS -->
              </tbody>
            </table>
          </div>

          <!-- Pagination Footer -->
          <footer id="pagination-wrapper"></footer>

        </section>

      </main>

    </div>
  </div>

  <style>
    @media (max-width: 896px) {
      .admin-menu-btn { display: flex !important; }
    }
  </style>

  <!-- Scripts -->
  <script src="../js/mockData.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/admin/videos.js"></script>
</body>
</html>
