<!DOCTYPE html>
<!-- ═══════════════════════════════════════════ -->
<!-- FILE: videos.html                          -->
<!-- PURPOSE: Video management page with grid,  -->
<!--          search, sort, bulk delete, inline -->
<!--          editing, and pagination.          -->
<!-- ═══════════════════════════════════════════ -->
<!--
  ============================================================================
  FILE: videos.html
  SECTION: Admin / Content
  DESCRIPTION: Video repository management page with search, sort, pagination,
  inline editing, bulk delete, and video card grid view.
  DEPENDENCIES: main.js, components.js, admin/videos.js
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ==================== HEAD ==================== -->
  <!-- THEME INIT: Sets data-theme from localStorage before render to avoid FOUC -->
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
  <!-- META: UTF-8 encoding declaration -->
  <!-- META: Responsive viewport configuration for mobile layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- META: SEO description for search engine result snippets -->
  <meta name="description" content="View, search, filter, inline edit, and bulk delete video database assets.">
  <!-- TITLE: Browser tab and search engine title -->
  <title>Manage Videos - Admin Console</title>
  <!-- STYLESHEET: main.css - Global design system (variables, resets, utilities, components) -->
  <link rel="stylesheet" href="../css/main.css">
  <!-- STYLESHEET: dashboard.css - Shared admin dashboard layout styles -->
  <link rel="stylesheet" href="../css/admin/dashboard.css">
  <!-- STYLESHEET: videos.css - Video management styles (grid cards, search bar, sort, bulk actions, pagination) -->
  <link rel="stylesheet" href="../css/admin/videos.css">
</head>
<body>

  <!-- TOAST CONTAINER: Fixed notification area for success/error feedback messages -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!--
    CONFIRMATION MODAL OVERLAY:
    Standard reusable dialog for confirming destructive actions (e.g., bulk delete).
    role="dialog" + aria-modal="true" for accessible keyboard interaction.
  -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ─── SECTION: ADMIN LAYOUT ──────────────── -->
  <div class="admin-layout">
    
    <!-- SIDEBAR OVERLAY: Mobile backdrop for closing sidebar -->
    <div class="sidebar-overlay"></div>

    <!--
      SIDEBAR CONTAINER (<aside>):
      Admin navigation injected by Components.injectAdminSidebar().
      Provides links to all admin sections with current page highlighted.
    -->
    <aside id="sidebar-container"></aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="admin-main">
      
      <!-- ─── SECTION: MOBILE HEADER ──────────── -->
      <!--
        ADMIN HEADER (Mobile Top Bar):
        Hamburger menu, "Console" label, "View Live Site" link, theme toggle.
        Visible on narrow screens for sidebar access.
      -->
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn hidden" aria-label="Open sidebar menu" style="border:none;background:none;cursor:pointer;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="text-sm-bold">Console</span>
        </div>
        <div class="admin-header-right">
          <a href="../index.html" class="btn btn-secondary" target="_blank">
            View Live Site
          </a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun hidden" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            </svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="admin-body">
        
        <!--
          TITLE ROW: Page heading with description and "Upload Video" CTA.
          The CTA button links to ./upload.html for adding new videos.
        -->
        <div class="admin-title-row">
          <div class="admin-title-group">
            <h1>Video Repository</h1>
            <p>Manage, paginate, search, and inline-edit your published clips and drafts.</p>
          </div>
          <div>
            <a href="./upload.html" class="btn btn-primary">
              Upload Video
            </a>
          </div>
        </div>

        <!-- ─── SECTION: MANAGEMENT CONTROLS ───── -->
        <!-- ==================== MANAGEMENT CONTROLS ==================== -->
        <div class="management-bar">
          
          <!-- LEFT CONTROLS: Search input and sort dropdown -->
          <div class="management-left">
            <!-- SEARCH: Client-side filtering by title or creator name -->
            <div class="table-search-container">
              <span class="table-search-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input type="text" id="table-search-input" placeholder="Search by title or creator..." aria-label="Search items">
            </div>
            <!-- SORT: Reorder videos by date, title, views, or likes -->
            <select id="sort-select" class="sort-select" aria-label="Sort videos">
              <option value="publishDate-desc">Newest First</option>
              <option value="publishDate-asc">Oldest First</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
              <option value="views-desc">Most Viewed</option>
              <option value="views-asc">Least Viewed</option>
              <option value="likes-desc">Most Liked</option>
              <option value="likes-asc">Least Liked</option>
            </select>
          </div>

          <!-- RIGHT CONTROLS: Select All checkbox, total count, bulk actions -->
          <div class="management-right">
            <!-- SELECT ALL: Toggles checkbox selection state on all visible video cards -->
            <label class="select-all-label">
              <input type="checkbox" id="header-checkbox" class="admin-checkbox" aria-label="Select all visible videos">
              <span>Select All</span>
            </label>
            <!-- TOTAL COUNT: Shows total number of videos in the system -->
            <span class="text-xs-muted" id="table-count-span">0 total videos</span>
            <!--
              BULK ACTIONS BAR (hidden by default):
              Appears when one or more videos are selected. Shows the count
              of selected videos and a "Delete Selected" button that triggers
              the confirmation modal for bulk deletion.
            -->
            <div id="bulk-actions-bar" style="display:none;">
              <span id="bulk-selected-count">0 selected</span>
              <button id="delete-selected-btn" class="btn btn-secondary delete-btn-sm">
                Delete Selected
              </button>
            </div>
          </div>

        </div>

        <!-- ─── SECTION: VIDEO CARDS GRID ──────── -->
        <!-- ==================== VIDEO CARDS GRID ==================== -->
        <section class="videos-section" aria-label="Videos catalog listing">
          <!--
            VIDEOS GRID:
            Displays video cards in a responsive grid layout. Each card shows
            thumbnail, title, creator, view/like counts, publish date, status
            badge, and action buttons (edit, delete, checkbox for bulk).
            Dynamically populated by admin/videos.js from mock data.
          -->
          <div class="videos-grid" id="videos-grid">
            <!-- Dynamically populated via JS -->
          </div>

          <!--
            PAGINATION FOOTER:
            Page navigation controls (prev/next, page numbers) injected by
            Components.injectPagination(). Handles client-side pagination
            of the video card grid.
          -->
          <footer id="pagination-wrapper"></footer>
        </section>

      </main>

    </div>
  </div>

  <!-- Edit Video Modal -->
  <div class="modal-overlay" id="edit-video-modal" role="dialog" aria-modal="true">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <h3 class="modal-title">Edit Video</h3>
        <button class="modal-close" id="edit-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" for="edit-title-input">Title</label>
          <input type="text" id="edit-title-input" class="form-input-field" style="width:100%;">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" for="edit-desc-input">Description</label>
          <textarea id="edit-desc-input" class="textarea-field" style="width:100%;min-height:60px;"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Tags</label>
          <div class="tags-chip-input" id="edit-tags-container">
            <div id="edit-tags-chips" class="tags-chips"></div>
            <input type="text" id="edit-tags-input" class="form-input-field" placeholder="Type tag and press comma or Enter" autocomplete="off">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" for="edit-status-input">Status</label>
          <select id="edit-status-input" class="form-input-field" style="width:100%;">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" for="edit-duration-input">Duration</label>
          <input type="text" id="edit-duration-input" class="form-input-field" style="width:100%;" placeholder="e.g. 10:14">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" for="edit-thumbnail-input">Thumbnail URL</label>
          <input type="text" id="edit-thumbnail-input" class="form-input-field" style="width:100%;" placeholder="https://...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="edit-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="edit-modal-save">Save Changes</button>
      </div>
    </div>
  </div>

  <style>
    @media (max-width: 896px) {
      .admin-menu-btn { display: flex !important; }
    }
  </style>

  <!-- ─── SECTION: SCRIPTS ──────────────────── -->
  <!-- ==================== SCRIPTS ==================== -->
  <!-- mockData.js: Mock data factory for prototype video data and tags -->
  <script src="../js/mockData.js"></script>
  <!-- supabase.js + supabase-api.js: Backend integration layer (optional) -->
  <script src="../js/supabase.js"></script>
  <script src="../js/supabase-api.js"></script>
  <!-- main.js: Core app - theme toggling, toast notifications, URL utilities -->
  <script src="../js/main.js"></script>
  <!-- components.js: UI injectors - sidebar, navbar, footer, pagination -->
  <script src="../js/components.js"></script>
  <!-- animations.js: Scroll-reveal and transition animation utilities -->
  <script src="../js/animations.js"></script>
  <!--
    admin/videos.js: Video management page logic.
    - Renders video cards in a responsive grid with pagination
    - Client-side search/filter by title or creator name
    - Sort videos by date, title, views, or likes
    - Inline editing of video title and description
    - Checkbox selection with Select All / deselect all
    - Bulk delete with confirmation modal
    - Individual video delete action
    - Pagination controls via Components.injectPagination()
  -->
  <script src="../js/admin/videos.js"></script>
</body>
</html>
