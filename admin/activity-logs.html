<!DOCTYPE html>
<!-- ═══════════════════════════════════════════ -->
<!-- FILE: activity-logs.html                   -->
<!-- PURPOSE: Timestamped table of user actions -->
<!--          and system events (publish, edit, -->
<!--          delete, login) with mock data.     -->
<!-- ═══════════════════════════════════════════ -->
<!--
  ============================================================================
  FILE: activity-logs.html
  SECTION: Admin / Monitoring
  DESCRIPTION: Displays a timestamped table of user actions and system events
  (video published, edited, deleted, login attempts, etc.). Data is generated
  client-side via mock data for demonstration and prototyping purposes.
  DEPENDENCIES: main.js, components.js, mockData.js
  ============================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- ==================== HEAD ==================== -->
  <!--
    THEME INIT SCRIPT:
    Reads the "site-theme" key from localStorage and sets the "data-theme"
    attribute on <html> BEFORE the page renders. This prevents a flash of
    unstyled content (FOUC) on theme switch. Falls back to "dark" if no
    preference is stored. The theme toggle button in the header calls
    window.App.toggleTheme() which updates localStorage and this attribute.
  -->
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("site-theme") || "dark")</script>
  <!-- META: Declares UTF-8 character encoding for proper Unicode text rendering -->
  <!-- META: Viewport width=device-width + initial-scale=1.0 ensures responsive
       layout on mobile devices by preventing default zoom and fitting content
       to the screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- META: Page description used by search engines in SERP snippets;
       should concisely describe the page content for SEO -->
  <meta name="description" content="Activity logs - monitor user actions and system events">
  <!-- TITLE: Appears in the browser tab, window title bar, and search engine results -->
  <title>Activity Logs - Antigravity Play</title>
  <!--
    STYLESHEET: main.css
    Global design system stylesheet. Provides:
    - CSS custom property tokens (colors, spacing, typography, shadows)
    - Base/reset styles (box-sizing, body defaults)
    - Utility classes (.btn, .badge, .modal, .toast, .card, .table, .form)
    - Admin layout styles (.admin-layout, .admin-main, .admin-header, .admin-content)
    - Responsive breakpoints and theme variant ([data-theme="light"])
  -->
  <link rel="stylesheet" href="../css/main.css">
</head>
<!-- ==================== BODY ==================== -->

<body>
  <!--
    TOAST CONTAINER:
    A fixed-position notification hub at the top-right of the viewport.
    window.App.showToast() inserts temporary alert messages (success/error/
    warning/info) here. role="status" + aria-live="polite" ensures screen
    readers announce new toasts without interrupting the current task.
  -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
  <!--
    CONFIRMATION MODAL OVERLAY:
    A reusable dialog for confirming destructive or impactful actions
    (delete, publish, etc.). Uses role="dialog" + aria-modal="true" for
    accessibility. The modal contains a title, body text, and Cancel/Confirm
    buttons. It is shown/hidden via JavaScript by toggling a .visible class
    on this overlay. Clicking the overlay backdrop closes the modal.
  -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm</h3><button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer"><button class="btn btn-secondary cancel-modal-btn">Cancel</button><button
          class="btn btn-primary confirm-modal-btn">Confirm</button></div>
    </div>
  </div>
  <!-- ─── SECTION: ADMIN LAYOUT ──────────────── -->
  <!-- ==================== ADMIN LAYOUT ==================== -->
  <!--
    ADMIN LAYOUT:
    A flex-based two-column layout. The sidebar (left) is dynamically injected
    via JavaScript. The main content area (right) fills the remaining width.
    On narrow screens (<896px) the sidebar is hidden by default and toggled
    via the hamburger menu button.
  -->
  <div class="admin-layout">
    <!--
      SIDEBAR CONTAINER:
      This empty container is populated by window.Components.injectAdminSidebar()
      on DOMContentLoaded. It renders the full admin navigation menu with links
      to Dashboard, Videos, Upload, Tags, Settings, Analytics, Notifications,
      Activity Logs, Error Logs, and Login Logs. The currently active page is
      highlighted based on the string passed to injectAdminSidebar().
    -->
    <div class="sidebar-overlay"></div>
    <aside id="sidebar-container"></aside>
    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="admin-main">
      <!-- ─── SECTION: MOBILE HEADER ──────────── -->
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn hidden" aria-label="Open sidebar menu" style="border:none;background:none;cursor:pointer;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="text-sm-bold">Console</span>
        </div>
        <div class="admin-header-right">
          <a href="../index.html" class="btn btn-secondary" target="_blank">View Live Site</a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun hidden" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            </svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>
      <!-- ─── SECTION: ADMIN CONTENT ──────────── -->
      <!--
        ADMIN CONTENT WRAPPER:
        Contains the main log card with the activity log table or empty state.
      -->
      <div class="admin-content">
        <!--
          LOG CARD:
          A contained card panel with a header (title + entry count badge)
          and a body (log table or loading/empty state).
        -->
        <div class="admin-card">
          <!-- ─── CARD HEADER ───────────────────── -->
          <!-- CARD HEADER: Section heading and dynamic entry count -->
          <div class="admin-card-header">
            <h2>Activity Logs</h2>
            <!--
              BADGE: Displays the total number of log entries.
              Updated dynamically by JavaScript after generating the entries.
              Class "badge-info" applies an info-style (blue) color.
            -->
            <span class="badge badge-info" id="log-count">0 entries</span>
          </div>
          <!-- ─── CARD BODY ─────────────────────── -->
          <!-- CARD BODY: Holds the log table or a loading/empty state placeholder -->
          <div class="admin-card-body">
            <div id="log-container">
              <div class="empty-state-container empty-state-body">
                <svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5"
                  viewBox="0 0 24 24" class="mx-auto-block">
                  <circle cx="12" cy="12" r="10" />
                  <polyline points="12 6 12 12 16 14" />
                </svg>
                <h3 class="text-lg-heading">Loading logs...</h3>
                <p style="font-size:var(--text-sm);color:var(--text-muted);">Please wait while log data is being loaded.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- ─── SECTION: SCRIPTS ──────────────────── -->
  <!-- ==================== SCRIPTS ==================== -->
  <!--
    mockData.js:
    Provides window.MockData - a collection of factory functions that generate
    sample video data, tags, log entries, and other mock datasets. Used for
    prototyping and demonstration without a backend server.
  -->
  <script src="../js/mockData.js"></script>
  <!--
    main.js:
    Core application module (window.App). Handles:
    - Theme toggling and persistence (localStorage)
    - Toast notification system (showToast, dismissToast)
    - URL query parameter parsing (getQueryParams)
    - Application-wide initialization logic
  -->
  <script src="../js/main.js"></script>
  <!--
    components.js:
    UI component injector (window.Components). Provides methods to
    dynamically render and insert:
    - Admin sidebar navigation (injectAdminSidebar)
    - Public navbar (injectNavbar)
    - Footer (injectFooter)
    - Pagination controls (injectPagination)
  -->
  <script src="../js/components.js"></script>
  <!--
    animations.js:
    Animation utilities (window.Animations). Provides scroll-triggered
    reveal animations (initScrollReveal), fade transitions, and other
    visual effects used across the application.
  -->
  <script src="../js/animations.js"></script>
  <!--
    INLINE SCRIPT - Page-specific logic for Activity Logs:
    1. Calls Components.injectAdminSidebar() to render the sidebar nav.
    2. Calls generateLogEntries() to create mock log data.
    3. Renders the entries as an HTML table inside #log-container.
    4. Updates #log-count with the total number of entries.
    5. Displays an empty-state message if no entries exist.
  -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.Components.injectAdminSidebar('activity-logs');

      const logContainer = document.getElementById('log-container');
      const logCount = document.getElementById('log-count');

      // Generate sample log entries
      const entries = generateLogEntries();
      logCount.textContent = entries.length + ' entries';

      if (entries.length === 0) {
        logContainer.innerHTML = '<div class="empty-state-container" style="text-align:center;padding:var(--space-4xl);"><svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto var(--space-md);display:block;"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg><h3 style="font-size:var(--text-lg);font-weight:600;margin-bottom:var(--space-xs);">No log entries found.</h3></div>';
      } else {
        logContainer.innerHTML = '<div class="log-table-wrapper"><table class="admin-table"><thead><tr><th>Timestamp</th><th>Action</th><th>User</th><th>Details</th></tr></thead><tbody>' + entries.map(e => '<tr><td style="white-space:nowrap;font-size:var(--text-xs);color:var(--text-muted);font-family:var(--font-mono);">' + e.time + '</td><td>' + e.col2 + '</td><td><span class="badge ' + e.badgeClass + '">' + e.col3 + '</span></td><td style="font-size:var(--text-sm);color:var(--text-secondary);">' + e.detail + '</td></tr>').join('') + '</tbody></table></div>';
      }

      function generateLogEntries() {
        return [
          { time: formatTime(0), col2: 'Video published', col3: 'Administrator', badgeClass: 'badge-success', detail: 'New video "Getting Started with Antigravity Play" was published.' },
          { time: formatTime(5), col2: 'Video edited', col3: 'Administrator', badgeClass: 'badge-info', detail: 'Video "Advanced CSS Techniques" tags were updated.' },
          { time: formatTime(15), col2: 'Tag created', col3: 'Administrator', badgeClass: 'badge-info', detail: 'New tag "Tutorial" was added to the system.' },
          { time: formatTime(30), col2: 'Video deleted', col3: 'Administrator', badgeClass: 'badge-warning', detail: 'Video "Test Upload 3" was permanently removed.' },
          { time: formatTime(60), col2: 'Settings changed', col3: 'Administrator', badgeClass: 'badge-info', detail: 'Site theme preference was updated.' },
          { time: formatTime(120), col2: 'Bulk action', col3: 'Administrator', badgeClass: 'badge-info', detail: '5 videos were moved to draft status.' },
          { time: formatTime(240), col2: 'Login attempt', col3: 'Administrator', badgeClass: 'badge-success', detail: 'Successful login from IP 192.168.1.1' },
          { time: formatTime(360), col2: 'Video archived', col3: 'Administrator', badgeClass: 'badge-warning', detail: 'Video "Old Stream 2025" was archived.' },
          { time: formatTime(480), col2: 'Password changed', col3: 'Administrator', badgeClass: 'badge-info', detail: 'Admin account password was successfully updated.' },
          { time: formatTime(600), col2: 'Video featured', col3: 'Administrator', badgeClass: 'badge-success', detail: 'Video "Epic Drone Shots" was featured on homepage.' }
        ];
        function formatTime(minutesAgo) {
          const d = new Date(Date.now() - minutesAgo * 60000);
          return d.toISOString().replace('T', ' ').slice(0, 19);
        }
      }
    });
  </script>
</body>

</html>
