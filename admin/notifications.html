<!DOCTYPE html>
<!-- ═══════════════════════════════════════════ -->
<!-- FILE: notifications.html                  -->
<!-- PURPOSE: Notification center with filter  -->
<!--          by type, mark-all-read, clear    -->
<!--          all, and pagination.             -->
<!-- ═══════════════════════════════════════════ -->
<!--
  ============================================================================
  FILE: notifications.html
  SECTION: Admin / Communication
  DESCRIPTION: Notification center for viewing and managing system alerts,
  upload status updates, and platform announcements. Supports filtering by
  type (all, unread, read, uploads, errors) and bulk mark-as-read/clear.
  DEPENDENCIES: main.js, components.js, admin/notifications.js
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ==================== HEAD ==================== -->
  <!--
    THEME INIT SCRIPT: Sets data-theme from localStorage on <html> before
    rendering to prevent FOUC. Defaults to "dark".
  -->
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
  <!-- META: UTF-8 encoding for proper Unicode rendering -->
  <!-- META: Responsive viewport configuration for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- META: Search engine description for this page -->
  <meta name="description" content="View and manage platform notifications, filter by type, mark as read.">
  <!-- TITLE: Browser tab title and search engine result title -->
  <title>Notifications - Admin Console</title>
  <!-- STYLESHEET: main.css - Global design system foundation -->
  <link rel="stylesheet" href="../css/main.css">
  <!-- STYLESHEET: dashboard.css - Shared admin dashboard layout styles -->
  <link rel="stylesheet" href="../css/admin/dashboard.css">
  <!-- STYLESHEET: videos.css - Shared list/table styles reused for notifications -->
  <link rel="stylesheet" href="../css/admin/videos.css">
  <!--
    STYLESHEET: notifications.css
    Notification-specific styles - filter buttons, notification item layout,
    read/unread states, toolbar, badge indicators, pagination.
  -->
  <link rel="stylesheet" href="../css/admin/notifications.css">
</head>
<!-- ==================== BODY ==================== -->
<body>

  <!-- TOAST CONTAINER: Fixed notification area for feedback messages -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- CONFIRMATION MODAL: Reusable dialog for action confirmations -->
  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ─── SECTION: ADMIN LAYOUT ──────────────── -->
  <!-- ==================== ADMIN LAYOUT ==================== -->
  <div class="admin-layout">
    <!-- SIDEBAR OVERLAY: Mobile backdrop that closes sidebar on tap -->
    <div class="sidebar-overlay"></div>
    <!-- SIDEBAR CONTAINER: Admin nav injected by Components.injectAdminSidebar() -->
    <aside id="sidebar-container"></aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="admin-main">
      <!-- ─── SECTION: MOBILE HEADER ──────────── -->
      <!-- ADMIN HEADER: Mobile top bar with hamburger menu, label, theme toggle -->
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn hidden" aria-label="Open sidebar menu" style="border:none;background:none;cursor:pointer;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="text-sm-bold">Console</span>
        </div>
        <div class="admin-header-right">
          <a href="../index.html" class="btn btn-secondary">View Live Site</a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun hidden" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <main class="admin-body">
        <!-- TITLE ROW: Page heading with description -->
        <div class="admin-title-row">
          <div class="admin-title-group">
            <h1>Notifications</h1>
            <p>System alerts, upload status, and platform updates.</p>
          </div>
        </div>

        <!-- ─── SECTION: Breadcrumbs ──────────── -->
        <!-- BREADCRUMBS: Dashboard > Notifications navigation path -->
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <ol class="breadcrumbs-list">
            <li><a href="./index.html">Dashboard</a></li>
            <li><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li><span>Notifications</span></li>
          </ol>
        </nav>

        <!-- ─── SECTION: Toolbar ──────────────── -->
        <!--
          TOOLBAR: Bulk action buttons for managing notifications.
          "Mark All as Read" marks all notifications as read via JS.
          "Clear All" removes all notifications via JS (with confirmation).
        -->
        <div class="notifications-toolbar">
          <div class="notifications-actions">
            <button class="btn btn-secondary notif-action-btn" id="mark-all-read-btn">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              Mark All as Read
            </button>
            <button class="btn btn-secondary notif-action-btn" id="clear-all-btn">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              Clear All
            </button>
          </div>
        </div>

        <!--
          FILTER BUTTONS: Category tabs for filtering notifications.
          - All: Shows all notifications
          - Unread: Only unread notifications
          - Read: Only read notifications
          - Uploads: Only upload-related notifications
          - Errors: Only error/warning notifications
          "active" class highlights the currently selected filter.
          Filtering is handled client-side in notifications.js.
        -->
        <!-- ─── SECTION: Filter Buttons ─────────── -->
        <div class="notification-filters">
          <button class="notification-filter-btn active" data-filter="all">All</button>
          <button class="notification-filter-btn" data-filter="unread">Unread</button>
          <button class="notification-filter-btn" data-filter="read">Read</button>
          <button class="notification-filter-btn" data-filter="uploads">Uploads</button>
          <button class="notification-filter-btn" data-filter="errors">Errors</button>
        </div>

        <!-- ─── SECTION: Notifications List ────── -->
        <!-- NOTIFICATIONS LIST: Dynamic container populated by JS with notification items -->
        <div class="notifications-list" id="notifications-list"></div>

        <!--
          EMPTY STATE: Shown when no notifications match the current filter.
          Hidden by default (display:none). Shown by JS when list is empty.
          Displays a bell icon, "No notifications" heading, and
          "You're all caught up!" message.
        -->
        <!-- ─── SECTION: Empty State ────────────── -->
        <div class="empty-state-container" id="notifications-empty" style="display:none;">
          <svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5" viewBox="0 0 24 24" class="mx-auto-block">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <h3 class="text-lg-heading">No notifications</h3>
          <p style="font-size:var(--text-sm);color:var(--text-muted);">You're all caught up!</p>
        </div>

        <!-- ─── SECTION: Pagination ─────────────── -->
        <!-- PAGINATION WRAPPER: Pagination controls injected by Components.injectPagination() -->
        <footer id="pagination-wrapper" style="margin-top:var(--space-xl);"></footer>

      </main>
    </div>
  </div>

  <!-- RESPONSIVE STYLE: Shows hamburger button on screens narrower than 896px -->
  <style>
    @media (max-width: 896px) { .admin-menu-btn { display: flex !important; } }
  </style>

  <!-- ─── SECTION: SCRIPTS ──────────────────── -->
  <!-- ==================== SCRIPTS ==================== -->
  <!-- mockData.js: Mock data generation for prototype notifications -->
  <script src="../js/mockData.js"></script>
  <!-- main.js: App core - theme management, toast notifications, utilities -->
  <script src="../js/main.js"></script>
  <!-- components.js: UI component injectors - sidebar, navbar, footer, pagination -->
  <script src="../js/components.js"></script>
  <!-- animations.js: Scroll-reveal and transition animation effects -->
  <script src="../js/animations.js"></script>
  <!--
    admin/notifications.js: Notifications page logic.
    - Generates mock notification items with read/unread states
    - Handles filter button clicks to show/hide notifications by category
    - Implements "Mark All as Read" and "Clear All" actions
    - Manages pagination via Components.injectPagination()
    - Toggles empty state visibility based on filtered results
  -->
  <script src="../js/admin/notifications.js"></script>
</body>
</html>
