<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("site-theme")||"dark")</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage platform notifications, filter by type, mark as read.">
  <title>Notifications - Admin Console</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin/dashboard.css">
  <link rel="stylesheet" href="../css/admin/videos.css">
  <link rel="stylesheet" href="../css/admin/notifications.css">
</head>
<body>

  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <div class="modal-overlay" id="confirm-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Action</h3>
        <button class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary cancel-modal-btn">Cancel</button>
        <button class="btn btn-primary confirm-modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="admin-layout">
    <div class="sidebar-overlay"></div>
    <aside id="sidebar-container"></aside>

    <div class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn" aria-label="Open sidebar menu" style="display:none;border:none;background:none;cursor:pointer;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span style="font-weight:600;font-size:var(--text-sm);">Console</span>
        </div>
        <div class="admin-header-right">
          <a href="../index.html" class="btn btn-secondary">View Live Site</a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <main class="admin-body">
        <div class="admin-title-row">
          <div class="admin-title-group">
            <h1>Notifications</h1>
            <p>System alerts, upload status, and platform updates.</p>
          </div>
        </div>

        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <ol class="breadcrumbs-list">
            <li><a href="./index.html">Dashboard</a></li>
            <li><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li><span>Notifications</span></li>
          </ol>
        </nav>

        <div class="notifications-toolbar">
          <div class="notifications-actions">
            <button class="btn btn-secondary notif-action-btn" id="mark-all-read-btn">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              Mark All as Read
            </button>
            <button class="btn btn-secondary notif-action-btn" id="clear-all-btn">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              Clear All
            </button>
          </div>
        </div>

        <div class="notification-filters">
          <button class="notification-filter-btn active" data-filter="all">All</button>
          <button class="notification-filter-btn" data-filter="unread">Unread</button>
          <button class="notification-filter-btn" data-filter="read">Read</button>
          <button class="notification-filter-btn" data-filter="uploads">Uploads</button>
          <button class="notification-filter-btn" data-filter="errors">Errors</button>
        </div>

        <div class="notifications-list" id="notifications-list"></div>

        <div class="empty-state-container" id="notifications-empty" style="display:none;">
          <svg width="48" height="48" fill="none" stroke="var(--text-muted)" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto var(--space-md) auto;display:block;">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <h3 style="font-size:var(--text-lg);font-weight:600;margin-bottom:var(--space-xs);">No notifications</h3>
          <p style="font-size:var(--text-sm);color:var(--text-muted);">You're all caught up!</p>
        </div>

        <footer id="pagination-wrapper" style="margin-top:var(--space-xl);"></footer>

      </main>
    </div>
  </div>

  <style>
    @media (max-width: 896px) { .admin-menu-btn { display: flex !important; } }
  </style>

  <script src="../js/mockData.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/admin/notifications.js"></script>
</body>
</html>
